---
- name: Install MariaDB server and the Python MySQL driver
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present

- name: Ensure MariaDB is running and enabled at boot
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Create the application database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create the application database user
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: localhost
    state: present
    update_password: on_create
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true
