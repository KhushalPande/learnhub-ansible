---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Create the web root directory
  ansible.builtin.file:
    path: "{{ web_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy the LearnHub home page from template
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ web_root }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Deploy the Nginx site configuration from template
  ansible.builtin.template:
    src: nginx-learnhub.conf.j2
    dest: /etc/nginx/sites-available/learnhub
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Enable the LearnHub site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/learnhub
    dest: /etc/nginx/sites-enabled/learnhub
    state: link
  notify: Restart nginx

- name: Disable the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx

- name: Ensure Nginx is running and enabled at boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
