# ---------------------------------------------------------------
# LearnHub inventory
# Single-instance demo: every tier runs on this EC2 control node,
# so each group points at localhost with a local connection.
# ---------------------------------------------------------------
[web]
localhost ansible_connection=local

[db]
localhost ansible_connection=local

[monitoring]
localhost ansible_connection=local

# Parent group so we can target the whole application at once
[learnhub:children]
web
db
monitoring

# ---------------------------------------------------------------
# Multi-server layout (production). Replace the groups above with:
#
# [web]
# web1 ansible_host=10.0.1.10 ansible_user=ubuntu
# [db]
# db1  ansible_host=10.0.2.10 ansible_user=ubuntu
# [monitoring]
# mon1 ansible_host=10.0.3.10 ansible_user=ubuntu
# ---------------------------------------------------------------
